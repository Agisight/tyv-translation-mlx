# XcodeGen: brew install xcodegen && xcodegen   →   TyvaTranslator.xcodeproj
name: TyvaTranslator
options:
  bundleIdPrefix: com.agisight
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  TyvaTranslator:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agisight.tyvatranslator
        PRODUCT_NAME: TyvaTranslator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Тыва Переводчик"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": iOS.entitlements
    dependencies:
      - package: mlx-swift-lm
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
